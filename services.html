                        <span class="navbar-toggler-icon"
                            aria-hidden="true"></span>
                    </button>
                    <dialog class="drawer drawer-end" tabindex="-1"
                        id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                        <div class="drawer-header">
                            <h5 class="drawer-title"
                                id="navbarDrawerLabel">Menu</h5>
                            <button type="button" class="btn-close"
                                data-bs-dismiss="drawer"

                                    </div>

                            </ul>
                        </div>
                    </dialog>
                </div>

        </header>


         <!-- Main -->
        <main>
            <section>
                <div id="carouselExample"
                    class="carousel carousel-overlay slide carousel-fade mt-3" data-bs-autoplay="true">
                    <div class="carousel-inner rounded-5">
                        <div class="carousel-item active" data-bs-interval="5000">
                            <img src="images/Hospital Banner 1.png" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item"  data-bs-interval="5000">
                            <img src="images/Hospital Banner 2-Picsart-AiImageEnhancer.jpg" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item"  data-bs-interval="5000">
                            <img src="images/CityCare Hospital_ Compassionate Care.png" class="d-block w-100" alt="...">
                        </div>
                    </div>
                    <div class="carousel-overlay-controls">
                        <div>
                            <button
                                class="btn-icon btn-sm btn-subtle theme-secondary"
                                type="button" data-bs-target="#carouselExample"
                                data-bs-slide="prev">
                                <span class="carousel-icon-prev"
                                    aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button
                                class="btn-icon btn-sm btn-subtle theme-secondary"
                                type="button" data-bs-target="#carouselExample"
                                data-bs-slide="next">
                                <span class="carousel-icon-next"
                                    aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                        <div class="carousel-indicators">
                            <button type="button"
                                data-bs-target="#carouselExample"
                                data-bs-slide-to="0" class="active"
                                aria-current="true"
                                aria-label="Slide 1"></button>
                            <button type="button"
                                data-bs-target="#carouselExample"
                                data-bs-slide-to="1"
                                aria-label="Slide 2"></button>
                            <button type="button"
                                data-bs-target="#carouselExample"
                                data-bs-slide-to="2"
                                aria-label="Slide 3"></button>
                        </div>
                    </div>
                </div>
            </section>
        </main>



        <!-- Vertical emergency button -->
        <section>
            <div class="sidebar position-fixed"

            </div>
        </section>
